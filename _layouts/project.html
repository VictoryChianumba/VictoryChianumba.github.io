---
layout: default
---
<article class="project">
  <h1>{{ page.title }}</h1>
  {% if page.summary %}
    <p class="summary"><em>{{ page.summary }}</em></p>
  {% endif %}
  {% if page.status %}
    <p class="status"><strong>Status:</strong> {{ page.status }}</p>
  {% endif %}
  {{ content }}
</article>
